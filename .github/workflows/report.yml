name: Отчёт по лидам в Telegram

# Запускается каждые 15 минут; сам скрипт по state.json понимает,
# отправлял ли он уже отчёт за этот день, поэтому дублей не будет.
# GitHub Actions бесплатен для приватных репозиториев в пределах
# 2000 минут в месяц — этот воркфлоу тратит ~40 минут в месяц.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_hour:
        description: "Час отправки для ручного запуска (укажите 0 — отправить сразу)"
        default: ""
      force:
        description: "Отправить, даже если за этот день отчёт уже уходил"
        type: boolean
        default: false
      poll_seconds:
        description: "Сколько секунд слушать команды бота (0 — не слушать)"
        default: "0"

# Новый запуск мгновенно вытесняет предыдущий: всегда работает максимум один
# слушатель, и всегда на самом свежем коде (без «окон» со старой версией)
concurrency:
  group: report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # state.json храним в кэше GitHub — так отчёт не задублируется
      # между запусками, а после сбоя отправится в следующий раз
      - name: Восстановить state.json
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: btr-state-${{ github.run_id }}
          restore-keys: |
            btr-state-

      - name: Собрать и отправить отчёт
        env:
          TZ: Europe/Moscow                      # часовой пояс, по которому считается "день"
          BTR_BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
          BTR_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BTR_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BTR_REPORT_CHAT_ID: ${{ vars.REPORT_CHAT_ID }}  # кому слать автоотчёты; пусто = всем чатам
          BTR_CLEAN_CHATS: ${{ vars.CLEAN_CHATS }}  # чаты, где в отчётах нет «(без метки)»
          BTR_SEND_HOUR: ${{ inputs.send_hour || '9' }}   # во сколько слать отчёты (по TZ выше)
          BTR_REPORTS: ${{ vars.REPORTS || 'day,week,month' }}  # виды отчётов
          BTR_POLL_SECONDS: ${{ inputs.poll_seconds || '720' }}  # сколько слушать команды бота
          BTR_STATUSES: ${{ vars.STATUSES }}        # фильтр: какие статусы считать
          BTR_UTM_SOURCES: ${{ vars.UTM_SOURCES }}  # фильтр: только эти источники
          BTR_BREAKDOWN_BY_STATUS: "0"              # блок «По статусам» выключен (1 — вернуть)
        run: python3 bitrix_report.py ${{ inputs.force && '--force' || '' }}

      - name: Сохранить state.json
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: btr-state-${{ github.run_id }}
